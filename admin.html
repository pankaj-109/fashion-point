<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Portal - Fashion Point</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              black: '#0a0a0a',
              cardDark: '#141414',
              borderDark: '#262626'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    .btn-bounce { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-bounce:hover { transform: translateY(-2px); }
    .btn-bounce:active { transform: scale(0.96); }
  </style>
</head>
<body class="bg-[#fafafa] dark:bg-brand-black text-neutral-900 dark:text-neutral-100 min-h-screen transition-colors">

  <!-- Admin Topbar -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-[#121212]/90 backdrop-blur-md border-b border-neutral-200 dark:border-neutral-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl border border-neutral-300 dark:border-neutral-700 flex items-center justify-center font-serif font-black text-sm">
          F<span class="text-neutral-400 -ml-0.5">P</span>
        </div>
        <div>
          <h1 class="text-base font-black tracking-wider uppercase font-serif">Cloud Store Manager</h1>
          <p class="text-[9px] uppercase tracking-widest text-emerald-500 font-semibold flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Firebase Live Sync
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <a href="index.html" class="px-3.5 py-1.5 rounded-xl border border-neutral-300 dark:border-neutral-700 text-xs font-bold hover:bg-neutral-100 dark:hover:bg-neutral-800 transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-left"></i> View Live Store
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
    
    <!-- Add Item Form -->
    <div class="bg-white dark:bg-brand-cardDark p-6 rounded-3xl border border-neutral-200 dark:border-brand-borderDark shadow-sm">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-neutral-200 dark:border-neutral-800">
        <h2 id="form-heading" class="text-base font-black uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i> Add Product (Syncs to All Phones)
        </h2>
      </div>

      <form id="product-form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-black uppercase tracking-wider block mb-1">Product Title</label>
            <input type="text" id="title" required placeholder="e.g. Pure Silk Banarasi Saree" class="w-full text-xs p-3 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-white outline-none" />
          </div>

          <div>
            <label class="text-[10px] font-black uppercase tracking-wider block mb-1">Category</label>
            <select id="category" required class="w-full text-xs p-3 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-white outline-none">
              <option value="Saree">Saree</option>
              <option value="Suit">Suit & Kurti</option>
              <option value="Men">Men & Blazer</option>
              <option value="Kids">Kids Wear</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-[10px] font-black uppercase tracking-wider block mb-1">Price (₹)</label>
            <input type="number" id="price" required placeholder="e.g. 2499" class="w-full text-xs p-3 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-white outline-none" />
          </div>

          <div>
            <label class="text-[10px] font-black uppercase tracking-wider block mb-1">Sizes (Comma separated)</label>
            <input type="text" id="sizes" required placeholder="e.g. Free Size OR M, L, XL" class="w-full text-xs p-3 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-white outline-none" />
          </div>
        </div>

        <div>
          <label class="text-[10px] font-black uppercase tracking-wider block mb-1">Product Photo</label>
          <input type="file" id="media-file" accept="image/*" class="w-full text-xs p-2 rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-neutral-900 text-neutral-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-neutral-200 dark:file:bg-neutral-800 dark:file:text-white" />
          <p class="text-[10px] text-neutral-400 mt-1">Photo will be auto-optimized for instant mobile loading.</p>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black uppercase tracking-wider py-3.5 rounded-xl btn-bounce shadow-md">
          Publish to Live Catalog
        </button>
      </form>
    </div>

    <!-- Inventory Listing -->
    <div class="bg-white dark:bg-brand-cardDark p-6 rounded-3xl border border-neutral-200 dark:border-brand-borderDark shadow-sm">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-neutral-200 dark:border-neutral-800">
        <h2 class="text-base font-black uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked"></i> Live Cloud Inventory
        </h2>
        <span class="text-[11px] text-neutral-400">Updates sync in real-time</span>
      </div>

      <div id="admin-inventory-list" class="space-y-3">
        <p class="text-xs text-neutral-500 py-6 text-center">Loading cloud inventory...</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC91-oOwG87W85hbpxzff4acW7KeymceMw",
      authDomain: "fashion-point-1c116.firebaseapp.com",
      projectId: "fashion-point-1c116",
      storageBucket: "fashion-point-1c116.firebasestorage.app",
      messagingSenderId: "755423609380",
      appId: "1:755423609380:web:9f428563412534b8618eb1",
      measurementId: "G-40C2REG60D"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let adminProducts = [];

    // Realtime Cloud Listener
    try {
      const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        adminProducts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAdminInventory();
      });
    } catch(e) {
      console.error(e);
    }

    // Submit Handler
    document.getElementById("product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.innerText = "Publishing to Cloud...";
      submitBtn.disabled = true;

      try {
        const title = document.getElementById("title").value.trim();
        const category = document.getElementById("category").value;
        const price = Number(document.getElementById("price").value);
        const sizes = document.getElementById("sizes").value.split(",").map(s => s.trim());
        const fileInput = document.getElementById("media-file");

        let imageUrl = "https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=700";
        if (fileInput.files.length > 0) {
          imageUrl = await resizeAndConvertImage(fileInput.files[0]);
        }

        await addDoc(collection(db, "products"), {
          title,
          category,
          price,
          sizes,
          imageUrl,
          inStock: true,
          createdAt: serverTimestamp()
        });

        alert("Item Published! Har phone par bina page refresh kiye ye item live ho gaya hai.");
        document.getElementById("product-form").reset();
      } catch (err) {
        console.error(err);
        alert("Upload error: " + err.message);
      } finally {
        submitBtn.innerText = "Publish to Live Catalog";
        submitBtn.disabled = false;
      }
    });

    // Image Compressor to keep it ultra lightweight
    function resizeAndConvertImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
            canvas.height = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          };
        };
        reader.onerror = error => reject(error);
      });
    }

    function renderAdminInventory() {
      const container = document.getElementById("admin-inventory-list");
      if (!container) return;

      if (adminProducts.length === 0) {
        container.innerHTML = `<p class="text-xs text-neutral-500 py-6 text-center">No products yet in cloud. Add your first item above!</p>`;
        return;
      }

      container.innerHTML = adminProducts.map(item => {
        const isAvailable = item.inStock !== false;
        return `
          <div class="bg-neutral-50 dark:bg-neutral-900 p-4 rounded-2xl border border-neutral-200 dark:border-neutral-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <img src="${item.imageUrl}" class="w-14 h-14 object-cover rounded-xl border border-neutral-300 dark:border-neutral-700"/>
              <div>
                <div class="flex items-center gap-2">
                  <h4 class="font-bold text-sm text-neutral-900 dark:text-white">${item.title}</h4>
                  <span class="text-[9px] px-2 py-0.5 rounded font-black uppercase ${isAvailable ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}">
                    ${isAvailable ? 'In Stock' : 'Sold Out'}
                  </span>
                </div>
                <p class="text-xs text-neutral-500 mt-0.5">₹${item.price} • ${item.category} • Sizes: [${(item.sizes || []).join(", ")}]</p>
              </div>
            </div>

            <div class="flex items-center gap-2 self-end md:self-center">
              <button onclick="window.toggleStockOnline('${item.id}', ${isAvailable})" class="px-3 py-1.5 rounded-lg border border-neutral-300 dark:border-neutral-700 text-xs font-semibold ${isAvailable ? 'hover:bg-amber-500 hover:text-white' : 'hover:bg-emerald-600 hover:text-white'} transition">
                ${isAvailable ? 'Mark Sold Out' : 'Mark In Stock'}
              </button>
              <button onclick="window.deleteProductOnline('${item.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-bold p-2">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.toggleStockOnline = async (id, currentStatus) => {
      await updateDoc(doc(db, "products", id), { inStock: !currentStatus });
    };

    window.deleteProductOnline = async (id) => {
      if (confirm("Are you sure you want to delete this product?")) {
        await deleteDoc(doc(db, "products", id));
      }
    };
  </script>
</body>
</html>
